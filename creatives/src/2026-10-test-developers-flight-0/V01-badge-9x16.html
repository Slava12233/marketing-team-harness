<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>V01 9x16 overlay</title>
<style>
  html, body { margin: 0; padding: 0; width: 704px; height: 1280px; overflow: hidden; background: transparent; }
  .frame { position: relative; width: 704px; height: 1280px; font-family: "Heebo", "Segoe UI", Arial, sans-serif; }
  .shade { position: absolute; inset: 0 0 auto 0; height: 420px; background: linear-gradient(to bottom, rgba(4,31,110,0.90) 0%, rgba(4,31,110,0.65) 55%, rgba(4,31,110,0) 100%); }
  .safe { position: absolute; top: 150px; right: 64px; left: 64px; color: #FFFFFF; text-align: right; }
  .kicker { font-size: 28px; font-weight: 500; margin: 0 0 12px; opacity: 0.92; }
  h1 { font-size: 54px; line-height: 1.14; font-weight: 800; margin: 0; }
  .badge { position: absolute; bottom: 300px; left: 48px; background: #041F6E; color: #FFFFFF; font-size: 24px; font-weight: 700; padding: 8px 18px; border-radius: 8px; border: 2px solid #FFFFFF; }
</style>
</head>
<body>
  <div class="frame">
    <div class="shade"></div>
    <div class="safe">
      <p class="kicker">ליזמים בישראל</p>
      <h1>פלטפורמה שמחברת<br>יזמים בישראל<br>לרוכשים מכל העולם</h1>
    </div>
    <div class="badge">הדמיה</div>
  </div>
</body>
</html>
