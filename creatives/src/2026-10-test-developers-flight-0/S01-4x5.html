<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>S01 4x5 test still</title>
<style>
  :root { --navy: #041F6E; --white: #FFFFFF; }
  html, body { margin: 0; padding: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--navy); }
  .frame { position: relative; width: 1080px; height: 1350px; background: url("bg-4x5.png") center / cover no-repeat; font-family: "Heebo", "Segoe UI", Arial, sans-serif; }
  .shade { position: absolute; inset: 0 0 auto 0; height: 560px; background: linear-gradient(to bottom, rgba(4,31,110,0.92) 0%, rgba(4,31,110,0.70) 55%, rgba(4,31,110,0) 100%); }
  .safe { position: absolute; top: 120px; right: 108px; left: 108px; color: var(--white); text-align: right; }
  .kicker { font-size: 38px; font-weight: 500; letter-spacing: 0.5px; opacity: 0.92; margin: 0 0 18px; }
  h1 { font-size: 78px; line-height: 1.12; font-weight: 800; margin: 0; }
  .badge { position: absolute; bottom: 72px; left: 72px; background: var(--navy); color: var(--white); font-size: 30px; font-weight: 700; padding: 10px 22px; border-radius: 8px; border: 2px solid var(--white); }
</style>
</head>
<body>
  <div class="frame">
    <div class="shade"></div>
    <div class="safe">
      <p class="kicker">ליזמים בישראל</p>
      <h1>פלטפורמה שמחברת<br>יזמים בישראל<br>לרוכשים מכל העולם</h1>
    </div>
    <div class="badge">הדמיה</div>
  </div>
</body>
</html>
